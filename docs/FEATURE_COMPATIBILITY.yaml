      "status": "planned",
      "implementation_scope": "Torch reference full/half no-PBC 与 full-list periodic MATRIX/COO、批边界、PBC shifts 和基础容量契约；periodic/no-PBC 的 MATRIX/COO 装配均已按体系/设备张量向量化；no-PBC cell-list 已作为 backend=torch_reference、method=cell_list 的显式 neighbor strategy 接线并完成 synthetic CPU/HCU 语义回归，真实规模性能与周期 cell-list 仍未完成",
      "scenario": "shape/dtype/layout、PBC shift、三斜晶胞、half/full、self、排序、空输入、溢出报错/扩容与 stream；拓扑不可微",
